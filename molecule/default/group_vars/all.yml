---
# ---------------------------------
# acromedia.postfix
# ---------------------------------
default_mail_recipient: nobody@example.com
postfix_inet_interfaces: 127.0.0.1

# ---------------------------------
# acromedia.nginx
# ---------------------------------
nginx_robots_policy: production

# ---------------------------------
# acromedia.php
# ---------------------------------
php_default_version: 8.5
php_use_legacy_module_lists: false
php_versions:  # make sure to specify at least 2 items; the verify stage makes sure version switching works.
  - 8.4
  - 8.5
# verify.yml re-applies the role with this version to prove a vhost can switch PHP versions;
# it must be one the php role installed, so it is taken from php_versions rather than written out.
_molecule_verify_alternate_version: "{{ php_versions | map('string') | reject('equalto', php_default_version | string) | first }}"

# ---------------------------------
# acromedia.virtual-host
# ---------------------------------
linux_owner: bigcorp
project: bigcorp
nginx_server_name: www.bigcorp.com
nginx_listeners:
  - server_name: "{{ nginx_server_name }}"
    port: 80
    add_headers:
      - name: 'x-molecule-foo'
        value: 'headers-are-fun'
        always: true
php_version: "{{ php_default_version }}"
web_root_dir_name: wwwroot
web_application: php
skip_mysql: true
vhost_nginx_conf_d_inline_custom: |
  map $request_method $auth_basic_realm_value {
    default "Restricted";
    "OPTIONS" "off";
  }
require_http_auth: true
http_auth_username: 'test'
http_auth_password: 'test'
http_auth_realm: '$auth_basic_realm_value'
arvh_php_fpm_slowlog_enabled: true
